name: Hourly ATS refresh

# Scrapes ~150 company boards directly. This is the tier that makes the list
# fast: roles land here within the hour, where the community trackers rebuild
# once a day. Runs in well under a minute.
#
# Public repositories get unlimited GitHub Actions minutes, so hourly costs
# nothing. Scheduled workflows are disabled after 60 days without repository
# activity — the commits this makes keep it alive.

on:
  schedule:
    # :20 past, not :00 — GitHub's scheduler is heavily congested on the hour
    # and delays runs queued there by 10+ minutes.
    - cron: "20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with refresh-full so the two never race to push.
  group: listings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Classifier regression tests
        run: python3 tests/test_classify.py

      - name: Scrape ATS boards
        id: aggregate
        run: |
          summary=$(python3 scripts/aggregate.py --ats fast --no-trackers | tail -1)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Render tables
        run: python3 scripts/render.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: hourly refresh — ${{ steps.aggregate.outputs.summary }}"
          git pull --rebase --autostash
          git push
