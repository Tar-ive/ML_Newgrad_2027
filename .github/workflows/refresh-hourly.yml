name: Hourly ATS refresh

# Scrapes ~150 company boards directly, plus every community tracker. This is
# the tier that makes the list fast: roles land here within the hour.
#
# The trackers used to be skipped here on the grounds that they rebuild once a
# day. That stopped being true once the source list grew -- zapplyjobs commits
# every few minutes and ApplyGuy a couple of times an hour -- and fetching all
# fourteen in parallel costs under two seconds, so the hourly job reads them
# all.
#
# Every stored posting is also re-verified against the employer's own ATS once
# its check comes due (12h for live roles, 6h for unverifiable ones, at once for
# new ones). The budget caps a cold start; a normal hour checks a few hundred
# postings in well under two minutes.
#
# Public repositories get unlimited GitHub Actions minutes, so hourly costs
# nothing. Scheduled workflows are disabled after 60 days without repository
# activity — the commits this makes keep it alive.

on:
  schedule:
    # :20 past, not :00 — GitHub's scheduler is heavily congested on the hour
    # and delays runs queued there by 10+ minutes.
    - cron: "20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with refresh-full so the two never race to push.
  group: listings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Classifier, experience and verification tests
        run: |
          python3 tests/test_classify.py
          python3 tests/test_experience.py
          python3 tests/test_verify.py

      - name: Scrape ATS boards and trackers
        id: aggregate
        run: |
          summary=$(python3 scripts/aggregate.py --ats fast --verify-budget 1200 | tail -1)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Render tables
        run: python3 scripts/render.py

      # Author commits as the repo owner so they count on the contribution graph.
      # GIT_COMMIT_EMAIL must be a verified email on the owner's GitHub account;
      # if the variable is unset, fall back to the bot identity rather than fail.
      - name: Commit if changed
        env:
          GIT_COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}
          GIT_COMMIT_NAME: ${{ vars.GIT_COMMIT_NAME }}
        run: |
          if [[ -n "$GIT_COMMIT_EMAIL" ]]; then
            git config user.email "$GIT_COMMIT_EMAIL"
            git config user.name "${GIT_COMMIT_NAME:-${{ github.repository_owner }}}"
          else
            echo "::warning::GIT_COMMIT_EMAIL is unset; committing as github-actions[bot]"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add -A
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: hourly refresh — ${{ steps.aggregate.outputs.summary }}"
          git pull --rebase --autostash
          git push
